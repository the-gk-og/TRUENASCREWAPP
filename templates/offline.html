<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>No connection - ShowWise</title>
  <meta name="robots" content="noindex, nofollow">
  <script>try { document.documentElement.setAttribute('data-theme', localStorage.getItem('showwise-theme') || 'light'); } catch (e) {}</script>
  <style>
    /* Self-contained on purpose: this page must render with nothing else available */
    :root { --page: #f1f3f6; --card: #fff; --ink: #171a1f; --muted: #5b6472; --line: #d3d8e0; --primary: #2557d6; }
    [data-theme="dark"] { --page: #1a1d23; --card: #23272f; --ink: #e9ebef; --muted: #b4bbc7; --line: #4a525f; --primary: #4f80f0; }
    * { box-sizing: border-box; margin: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.25rem;
           font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: var(--page); color: var(--ink); }
    main { width: 100%; max-width: 420px; padding: 1.5rem; background: var(--card); border: 1px solid var(--line); border-radius: 8px; }
    h1 { font-size: 1.35rem; margin-bottom: .5rem; }
    p { color: var(--muted); line-height: 1.5; margin-bottom: 1rem; }
    .links { display: grid; gap: .6rem; margin-bottom: 1rem; }
    a, button { display: flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 1rem; border-radius: 6px;
                font: inherit; font-weight: 600; text-decoration: none; cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
    a.main, button.main { background: var(--primary); border-color: var(--primary); color: #fff; }
    small { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>No connection</h1>
    <p>This page hasn’t been saved on this device, so it can’t open right now. These can:</p>
    <div class="links">
      <a class="main" href="/equipment/checkout">Scan gear out / in</a>
      <a href="/picklist">Pick list</a>
      <a href="/dashboard">Today</a>
    </div>
    <button type="button" onclick="location.reload()">Try again</button>
    <p style="margin: 1rem 0 0"><small>Scans you make with no connection are kept on this device and sent when it comes back.</small></p>
  </main>
  <script>window.addEventListener('online', () => location.reload());</script>
</body>
</html>
